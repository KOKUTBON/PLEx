name: Dependency Review
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4
        with:
          allow-ghsas: >-
            GHSA-gm62-xv2j-4w53,
            GHSA-2xpw-w6gg-jr37,
            GHSA-38jv-5279-wg99,
            GHSA-qccp-gfcp-xxvc,
            GHSA-8988-9cw3-xx77,
            GHSA-vxq7-64xx-v4gw,
            GHSA-34jh-p97f-mpxf,
            GHSA-pq67-6m6q-mj2v,
            GHSA-j8r2-6x86-q33q,
            GHSA-9wx4-h78v-vm56,
            GHSA-9hjg-9r4m-mvj7,
            GHSA-gc5v-m9x4-r6x2

