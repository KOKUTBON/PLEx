repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/snapshots/
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        pass_filenames: false
        args: [src/plex]
        additional_dependencies:
          - types-PyYAML>=6.0.12.20240917
          - pathspec>=0.11
  - repo: local
    hooks:
      - id: plex
        name: plex (changed-only)
        entry: >-
          python -c "import sys; sys.path.insert(0, 'src'); from plex.cli import main;
          raise SystemExit(main())" analyze . --changed-only --diff-functions
          --new-findings-only --max-findings 25
        language: python
        additional_dependencies:
          - PyYAML>=6.0.1
        pass_filenames: false
