<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLEx Report Explorer</title>
    <meta
      name="description"
      content="Interactive PLEx report: performance findings, a complexity regression, CI gate policy, auto-fix diffs, and raw JSON/SARIF output generated by the real engine."
    />
    <meta name="theme-color" content="#06070d" />
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
    <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/app.css" />
    <script type="module" src="../assets/js/app.js"></script>
  </head>
  <body>
    <a class="sr-only" href="#main">Skip to report</a>
    <header class="topbar">
      <a class="brand" href="../" aria-label="PLEx home">
        <img src="../assets/img/logo.svg" alt="" width="28" height="28" />
        <span>PLEx</span>
      </a>
      <span class="topbar-sep" aria-hidden="true">/</span>
      <div class="crumb" id="crumb">
        <span class="crumb-title">Report explorer</span>
      </div>
      <div class="topbar-actions">
        <button class="palette-trigger" id="palette-open" type="button" aria-label="Open command palette">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <span>Search findings, files, rules…</span>
          <kbd id="palette-kbd">⌘K</kbd>
        </button>
        <label class="btn btn-sm" id="load-report" title="Open a plex.json report from your machine">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 20h16" /></svg>
          <span class="hide-sm">Open plex.json</span>
          <input type="file" accept=".json,application/json" class="sr-only" id="file-input" />
        </label>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" /></svg>
        </button>
        <a class="icon-btn" href="https://github.com/KOKUTBON/PLEx" aria-label="PLEx on GitHub" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" style="fill: currentColor; stroke: none">
            <path
              d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"
            />
          </svg>
        </a>
      </div>
    </header>

    <main id="main" class="app" aria-busy="true">
      <section class="gate" id="gate" aria-live="polite"></section>
      <section class="kpis" id="kpis" aria-label="Report summary"></section>

      <nav class="tabs" role="tablist" aria-label="Report views" id="tabs">
        <button role="tab" data-view="findings" aria-selected="true">Findings <span class="count" data-count="findings"></span></button>
        <button role="tab" data-view="pr">Pull request <span class="count" data-count="pr"></span></button>
        <button role="tab" data-view="hotspots">Hotspots</button>
        <button role="tab" data-view="fixes">Auto-fix <span class="count" data-count="fixes"></span></button>
        <button role="tab" data-view="outputs">Raw outputs</button>
      </nav>

      <section class="view" data-view="findings" role="tabpanel">
        <div class="findings-layout">
          <aside class="filters" id="filters" aria-label="Filters"></aside>
          <div class="list-pane">
            <div class="list-head">
              <div class="list-meta" id="list-meta"></div>
              <label class="sort">
                <span class="sr-only">Sort by</span>
                <select id="sort">
                  <option value="risk">Sort: risk score</option>
                  <option value="confidence">Sort: confidence</option>
                  <option value="location">Sort: location</option>
                </select>
              </label>
            </div>
            <ol class="finding-list" id="finding-list" aria-label="Findings"></ol>
          </div>
          <div class="inspector" id="inspector" aria-label="Finding details"></div>
        </div>
      </section>

      <section class="view" data-view="pr" role="tabpanel" hidden></section>
      <section class="view" data-view="hotspots" role="tabpanel" hidden></section>
      <section class="view" data-view="fixes" role="tabpanel" hidden></section>
      <section class="view" data-view="outputs" role="tabpanel" hidden></section>
    </main>

    <div class="drop-overlay" id="drop-overlay" hidden>
      <div>
        <strong>Drop a plex.json report</strong>
        <span>It's parsed in your browser and never uploaded.</span>
      </div>
    </div>

    <dialog class="palette" id="palette" aria-label="Command palette">
      <div class="palette-input">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="palette-q" type="text" placeholder="Jump to a finding, file, rule, or action…" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <ul id="palette-results" role="listbox"></ul>
      <footer class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>j</kbd><kbd>k</kbd> next / prev finding</span><span><kbd>/</kbd> filter</span>
      </footer>
    </dialog>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  </body>
</html>
